# Timed log format: adds total request time and upstream response time so a
# future 504 incident can be mapped to the slow endpoint, not just counted.
log_format maorif_timed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time '
                        'urt=$upstream_response_time';

server {
    server_name maorif-zafarobod.tj www.maorif-zafarobod.tj 169.58.154.191;

    access_log /var/log/nginx/access.log maorif_timed;

    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/maorif_zafarobod/staticfiles/;
    }

    location /media/ {
        alias /var/www/maorif_zafarobod/media/;
    }

    # /sw.js must keep its root URL (service-worker scope '/'), but it is a
    # static asset — serve it straight from disk instead of a Django worker.
    # Mirrors portal.views.service_worker: same file, same headers.
    location = /sw.js {
        alias /var/www/maorif_zafarobod/staticfiles/portal/sw.js;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maorif-zafarobod.tj/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maorif-zafarobod.tj/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.maorif-zafarobod.tj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = maorif-zafarobod.tj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name maorif-zafarobod.tj www.maorif-zafarobod.tj 169.58.154.191;
    return 404; # managed by Certbot




}
