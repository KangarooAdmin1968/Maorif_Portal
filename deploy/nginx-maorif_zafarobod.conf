# Timed log format: adds total request time and upstream response time so a
# future 504 incident can be mapped to the slow endpoint, not just counted.
log_format maorif_timed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time '
                        'urt=$upstream_response_time';

server {
    server_name maorif-zafarobod.tj www.maorif-zafarobod.tj 169.58.154.191;

    access_log /var/log/nginx/access.log maorif_timed;

    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/maorif_zafarobod/staticfiles/;
        # Unhashed asset names — cache for a day so repeat visits skip
        # the revalidation round-trip; changes still propagate within 24h.
        expires 1d;
    }

    location /media/ {
        alias /var/www/maorif_zafarobod/media/;
    }

    # Admin backup download: Django authenticates the superuser and replies
    # with X-Accel-Redirect pointing here. `internal` keeps the directory
    # unreachable from outside, and nginx streams the ~1GB snapshot itself
    # so no gunicorn worker is held by a long download.
    location /protected-backup/ {
        internal;
        alias /var/www/maorif_zafarobod/backups/;
    }

    # /sw.js must keep its root URL (service-worker scope '/'), but it is a
    # static asset — serve it straight from disk instead of a Django worker.
    # Mirrors portal.views.service_worker: same file, same headers.
    location = /sw.js {
        alias /var/www/maorif_zafarobod/staticfiles/portal/sw.js;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
    }

    # Video-lesson downloads: /video-dl/<file>.mp4 streams the Ministry
    # e-library file through nginx itself — a Django proxy would hold a
    # worker past the 60s gunicorn timeout on these ~600MB files — and
    # adds Content-Disposition so the browser saves the file instead of
    # playing it in a new tab. The filename guard keeps this from
    # becoming an open proxy to arbitrary marifat.tj paths.
    location ~ ^/video-dl/([0-9A-Za-z_-]+\.mp4)$ {
        # proxy_pass holds a variable ($1), so the upstream name is
        # resolved at REQUEST time — without a resolver nginx answers
        # 502 "no resolver defined to resolve marifat.tj".
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://marifat.tj/admin/videos/$1;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host marifat.tj;
        proxy_set_header Connection '';
        add_header Content-Disposition 'attachment' always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Excel exports/imports and the quarter archive build their payloads
    # synchronously inside a gunicorn worker — a large report can outlast
    # the default 60s proxy_read_timeout and surface as a 504 even though
    # the worker is still healthy (gthread workers keep heartbeating while
    # a request thread runs). Give only these paths a longer window.
    location ~ ^/(schools/documents/[^?]*/export/|schools/years/archive/|monitoring-dashboard/export/|school/[^?]*/export/|class/[^?]*/import/|school/[^?]*/import_excel/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maorif-zafarobod.tj/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maorif-zafarobod.tj/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.maorif-zafarobod.tj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = maorif-zafarobod.tj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name maorif-zafarobod.tj www.maorif-zafarobod.tj 169.58.154.191;
    return 404; # managed by Certbot




}
